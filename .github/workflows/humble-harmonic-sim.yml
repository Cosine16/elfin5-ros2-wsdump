name: Humble Harmonic simulation smoke

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ROS_DOMAIN_ID: "85"
      ROS_LOCALHOST_ONLY: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Check out source and direct submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify required submodules
        run: |
          git submodule status -- third_party/elfin_robot_ros2 third_party/RoboNeuron
          test -f third_party/elfin_robot_ros2/elfin_description/package.xml
          test -f third_party/RoboNeuron/pyproject.toml

      - name: Install APT prerequisites and UTF-8 locale
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release locales software-properties-common
          sudo add-apt-repository universe -y
          sudo locale-gen en_US.UTF-8

      - name: Add official ROS 2 and Gazebo APT repositories
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --show-error --location --retry 3 \
            https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | sudo tee /usr/share/keyrings/ros-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu jammy main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          curl --fail --show-error --location --retry 3 \
            https://packages.osrfoundation.org/gazebo.gpg \
            | sudo tee /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable jammy main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list >/dev/null
          sudo apt-get -o Acquire::Retries=3 update

      - name: Install ROS, Gazebo and native build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            python3-colcon-common-extensions python3-rosdep \
            python3-pytest python3-lark \
            ros-dev-tools ros-humble-desktop ros-humble-moveit \
            ros-humble-ros2-control ros-humble-ros2-controllers \
            ros-humble-xacro ros-humble-cv-bridge \
            gz-harmonic ros-humble-ros-gz-sim ros-humble-ros-gz-bridge \
            ros-humble-gz-ros2-control \
            python3-opencv python3-numpy python3-scipy python3-yaml \
            liburdfdom-tools xvfb mesa-utils libgl1-mesa-dri libegl1

      - name: Resolve dependencies declared by the selected packages
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update
          source /opt/ros/humble/setup.bash
          rosdep install --rosdistro humble --ignore-src -y --skip-keys "rviz ament_python" --from-paths \
            third_party/elfin_robot_ros2/elfin_description \
            third_party/elfin_robot_ros2/elfin5/elfin5_gz_sim \
            third_party/elfin_robot_ros2/elfin5/elfin5_ros2_moveit2 \
            apps/workflows/handeye/elfin5_handeye

      - name: Validate package discovery, scripts and existing tests
        run: |
          mkdir -p .build/validation
          colcon list --base-paths apps
          bash scripts/prepare_vendor.sh --check
          bash -n \
            scripts/build_handeye.sh \
            scripts/handeye_env.sh \
            scripts/run_handeye.sh \
            scripts/test_handeye_sim.sh \
            apps/policies/smolvla/run_gz_sim.sh \
            apps/policies/smolvla/run_bridge.sh
          python3 -m compileall -q \
            apps/workflows/handeye/elfin5_handeye \
            scripts/handeye_sim_smoke.py
          PYTHONPATH=apps/workflows/handeye/elfin5_handeye \
            python3 -m pytest -q \
            tests/test_vendor_integration.py \
            apps/workflows/handeye/elfin5_handeye/test \
            --basetemp=.build/validation/pytest-vendor

      - name: Test RoboNeuron ROS distribution selection
        run: python3 -m pytest -q third_party/RoboNeuron/tests/test_ros_runtime_config.py

      - name: Build and import RoboNeuron ROS interfaces
        run: |
          source /opt/ros/humble/setup.bash
          colcon --log-base .build/roboneuron/log build \
            --base-paths third_party/RoboNeuron/ros \
            --build-base .build/roboneuron/build \
            --install-base .build/roboneuron/install \
            --packages-select roboneuron_interfaces \
            --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3
          source .build/roboneuron/install/setup.bash
          python3 -c 'from roboneuron_interfaces.msg import EEFDeltaCommand, RawActionChunk, TaskSpaceState'

      - name: Build the existing Humble/Harmonic target
        timeout-minutes: 30
        run: bash scripts/build_handeye.sh

      - name: Run headless simulation smoke
        timeout-minutes: 12
        run: xvfb-run -a -s "-screen 0 1280x1024x24" bash scripts/test_handeye_sim.sh

      - name: Upload build and simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-harmonic-sim-logs
          path: |
            .build/handeye/log/
            outputs/handeye/
          if-no-files-found: warn
          retention-days: 7
