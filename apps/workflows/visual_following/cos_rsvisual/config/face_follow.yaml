# =============================================================================
# cos_rsvisual/config/face_follow.yaml
# 真机人脸跟随两个组件的参数文件, 按节点名分节(组件在 vision_container 内以
# 对应节点名加载, 参数文件按节点名匹配)。
# 与 follower.yaml 的区别: 面向真机实相机(RealSense 彩色 + 对齐深度),
# 跟随目标是 /face_pose(人脸)而非 /person_pose(人体)。
# 注意: 真机不用仿真时钟, launch 里统一传 use_sim_time:=false。
# =============================================================================

# ---- Haar 人脸检测器(真机实相机) ----
face_visual_detector:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    # 深度必须对齐到彩色(realsense launch: align_depth.enable:=true)
    depth_topic: "/camera/aligned_depth_to_color/image_raw"   # 16UC1 毫米, 组件自动转换
    camera_info_topic: "/camera/color/camera_info"            # 用彩色内参反投影
    cascade_path: "/usr/share/opencv4/haarcascades/haarcascade_frontalface_default.xml"
    profile_cascade_path: ""   # 侧面兜底, 如 "/usr/share/opencv4/haarcascades/haarcascade_profileface.xml"
    enable: true
    detect_every_n_frames: 3   # Haar CPU 开销远小于 HOG, 每 3 帧检测一次(15fps 输入 ≈ 5Hz)
    scale_factor: 1.1
    min_neighbors: 5           # 误检多时调大, 漏检多时调小
    min_face_size: 48          # 最小人脸框(像素), 小脸上限 ≈ 距离上限
    min_range: 0.2
    max_range: 3.0           # 实测站位 ~2.0m, 留足余量
    target_frame: "world"
    face_topic: "/face_pose"
    publish_debug_image: true  # /face_debug_image (画框+距离), 用 rqt_image_view 看
    debug_image_topic: "/face_debug_image"
    jump_threshold: 0.5        # 跳变门控: 距上帧发布位置超过该值(m)的候选先挂起
    jump_confirm_frames: 3     # 连续 N 帧落在同一新位置才接受(防真走动被锁死)

# ---- 末端跟随器(复用 ArmFollower, person_topic 改订 /face_pose) ----
# 参数语义同 follower.yaml 的 arm_follower 节; 数值按人脸跟随调:
# 人脸小动作多 -> deadband 调小; 真机 -> 速度缩放调低。
face_follower:
  ros__parameters:
    person_topic: "/face_pose"
    planning_group: "elfin_arm"
    target_frame: "world"
    end_link: "elfin_end_link"
    deadband: 0.06            # 人脸位置变化超过该值(m)才更新目标
    update_period: 1.2        # 两次发送目标的最小间隔(s)
    min_height: 0.05          # 目标点 z 下限(m), 低于则跳过
    keep_distance: 0.40       # 人脸距末端小于该值(m)则跳过(贴太近)
    velocity_scaling: 0.2     # 真机放慢, MoveIt 速度/加速度缩放
    enable_follow: true       # 可运行时用 ros2 param set /face_follower enable_follow false 关闭
    # 初始关节目标(home 奇异位形逃离用)仅仿真需要; 真机当前已在非奇异姿态,
    # 若执行该绝对关节目标会产生大幅度摆动, 真机填非 6 元素数组即跳过
    # (注意不能填空数组 []: foxy launch 无法推断空数组的参数类型会崩)
    initial_joints: [0.0]
