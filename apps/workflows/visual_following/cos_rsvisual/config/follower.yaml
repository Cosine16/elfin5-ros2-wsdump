# =============================================================================
# cos_rsvisual/config/follower.yaml
# 视觉跟随三个组件共用参数文件, 按节点名分节(组件在 vision_container 内以
# 对应节点名加载, 参数文件按节点名匹配)。
# 注意: launch 里统一传 use_sim_time, 不在这里写。
# =============================================================================

# ---- 深度图人体检测器(仿真默认启用) ----
person_depth_detector:
  ros__parameters:
    # 仿真(gazebo_ros_camera, camera_name=camera)深度图: /camera/depth/image_raw (32FC1, 米)
    # 真机 realsense: /camera/depth/image_rect_raw (16UC1, 毫米) —— 两种编码组件都支持
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/depth/camera_info"
    min_range: 0.3            # 有效距离带下限 (m)
    max_range: 2.9            # 有效距离带上限 (m); home 位姿下地面恰在 3.0m 处, 上限取 2.9 天然排除地面
    min_cluster_pixels: 200   # 连通域最少像素数, 低于视为噪声
    use_roi: false            # 是否只在 ROI 内检测
    roi_x: 0
    roi_y: 0
    roi_width: 640
    roi_height: 480
    target_frame: "world"     # 输出位姿的参考系
    person_topic: "/person_pose"
    publish_rate: 10.0        # 最高处理/发布频率 (Hz)

# ---- HOG 视觉人形检测器(与深度检测器互斥, 默认不加载) ----
person_visual_detector:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/depth/camera_info"
    enable: false             # 总开关, launch 的 enable_visual_detector 控制是否加载
    detect_every_n_frames: 5  # HOG CPU 较慢, 每 N 帧检测一次
    scale_factor: 1.05
    min_neighbors: 3
    min_range: 0.3
    max_range: 2.9
    target_frame: "world"
    person_topic: "/person_pose"

# ---- 末端跟随器 ----
# 直接用内置 MoveGroupInterface 规划执行(本环境 elfin_basic_api 的 /cart_goal
# 订阅存在只收首条消息的问题, 故不经过它)
arm_follower:
  ros__parameters:
    person_topic: "/person_pose"
    planning_group: "elfin_arm"
    target_frame: "world"
    end_link: "elfin_end_link"
    deadband: 0.15            # 人位置变化超过该值(m)才更新目标
    update_period: 1.5        # 两次发送目标的最小间隔(s)
    min_height: 0.10          # 目标点 z 下限(m), 低于则跳过
    keep_distance: 0.45       # 人距末端小于该值(m)则跳过(视为贴太近)
    velocity_scaling: 0.3     # MoveIt 速度/加速度缩放
    enable_follow: true       # 可运行时用 ros2 param set 关闭
    initial_joints: [0.0, 0.0, 0.0, 0.0, -0.5, 0.0]  # 初始手腕下弯, 离开 home 奇异位形

# ---- 规划场景障碍物更新器 ----
# Foxy 的 MoveIt deb 不含 PointCloudOctomapUpdater 插件(点云进不了 OctoMap),
# 用本组件把 /person_pose 作为圆柱体 collision object 送进规划场景,
# 使 MoveIt 规划时绕开人。升级 Humble+ 后可换回 sensors_3d.yaml 的 octomap 方案。
obstacle_updater:
  ros__parameters:
    person_topic: "/person_pose"
    target_frame: "world"
    planning_scene_topic: "/planning_scene"
    obstacle_radius: 0.30     # 假人圆柱半径 (m)
    obstacle_height: 1.7      # 假人圆柱高度 (m), 底部落地
    update_period: 2.0        # 位置更新最小间隔 (s); 过频的场景更新会打断执行中的轨迹
    move_threshold: 0.3       # 人位置变化超过该值(m)才更新障碍物; 同上, 减少场景抖动
    lost_timeout: 3.0         # 超过该时长(s)没新人位置则移除障碍物
    enabled: true
