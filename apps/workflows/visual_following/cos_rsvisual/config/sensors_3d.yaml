# =============================================================================
# cos_rsvisual/config/sensors_3d.yaml
# 【注意: 本文件在当前 Foxy 环境下不会被加载】
# Foxy 的 MoveIt deb (2.2.3) 未编译 PointCloudOctomapUpdater 插件(foxy 分支
# occupancy_map_monitor/CMakeLists.txt 不含 updater), 注入本配置只会报
# "plugin ... does not exist"。当前障碍物感知由 obstacle_updater 组件实现
# (/person_pose -> /planning_scene collision object)。本文件保留供升级到
# Humble+ 后启用 octomap 点云方案使用, 届时把它加回 move_group 参数即可。
#
# MoveIt2 point_cloud_octomap_updater 配置(foxy MSA 惯例: 顶层字段,
# 不带 ros__parameters 包装, 用 yaml.safe_load 读成 dict 整体注入)。
# =============================================================================

# 传感器列表
sensors: ["realsense_depth"]

realsense_depth:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/points
  max_range: 3.0
  point_subsample: 1
  padding_offset: 0.05
  padding_scale: 1.0
  max_update_rate: 5.0
  filtered_cloud_topic: /realsense_depth/filtered_cloud
  ns: ""
