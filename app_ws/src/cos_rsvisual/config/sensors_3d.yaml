# =============================================================================
# cos_rsvisual/config/sensors_3d.yaml
# MoveIt move_group 的 octomap 点云更新配置(Humble MoveIt 2.5+ 生效)。
#
# 前置: ros-humble-moveit-ros-perception (PointCloudOctomapUpdater 插件所在包)
#
# 注入位置(两边都用 load_yaml 读本文件, 平铺格式, 不带 ros__parameters 包装):
#   真机: elfin5_ros2_moveit2/launch/elfin5_moveit_rviz.launch.py
#   仿真: cos_rsvisual/launch/elfin5_rs_sim.launch.py
#         (仿真 move_group 把点云话题 remap 到 gazebo 插件的 /camera/points)
#
# 真机点云话题 /camera/depth/color/points 来自 realsense2_camera
# (4.5x, camera_namespace=camera), 需 pointcloud.enable:=true 才有数据。
# =============================================================================

# 传感器列表
sensors: ["realsense_depth"]

realsense_depth:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 3.0
  point_subsample: 1
  padding_offset: 0.05
  padding_scale: 1.0
  max_update_rate: 5.0
  filtered_cloud_topic: /realsense_depth/filtered_cloud
  ns: ""
